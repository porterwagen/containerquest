# Container Quest — the whole platform on one host.
#
# teach: Compose is the Docker-native way to run several containers together.
# teach: Read it as the "before" picture: everything here has a Kubernetes
# teach: equivalent in infra/k8s, and comparing the two files side by side is
# teach: the fastest way to see what Kubernetes actually adds.

name: container-quest

# teach: An anchor. YAML lets us define this once and merge it into every
# teach: service, so build metadata stays consistent across five languages.
x-build-args: &build-args
  GIT_SHA: ${GIT_SHA:-dev}
  BUILD_TIME: ${BUILD_TIME:-unknown}

services:
  # --- The control plane -----------------------------------------------------

  # teach: The dashboard needs to restart containers and watch daemon events.
  # teach: The naive way is to bind-mount /var/run/docker.sock into it — which
  # teach: hands that container the daemon's ENTIRE API. The daemon runs as
  # teach: root, so anything holding that socket can start a privileged
  # teach: container that mounts your host filesystem. It is root on your
  # teach: machine, and the container boundary does not contain it.
  # teach:
  # teach: (`:ro` does not help. It makes the socket FILE read-only; it does
  # teach: nothing to the API calls you send over it.)
  # teach:
  # teach: So instead: a proxy holds the socket, and publishes an HTTP API with
  # teach: an explicit allowlist. The dashboard gets exactly four capabilities
  # teach: and no others. This is *precisely* the shape of the Kubernetes RBAC
  # teach: you will write in Phase 4 — a ServiceAccount that may list pods and
  # teach: scale one Deployment, and nothing more. Least privilege, twice.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3
    environment:
      CONTAINERS: 1   # list and inspect containers
      EVENTS: 1       # subscribe to the daemon event stream
      POST: 1         # required for restart (write operations)
      # Everything else stays off. Each of these would be a privilege
      # escalation path, and this is the interesting part of the file:
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      EXEC: 0         # `docker exec` into any container
      SECRETS: 0
      SWARM: 0
      SERVICES: 0
      SYSTEM: 0
      INFO: 0
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      NODES: 0
      PLUGINS: 0
      SESSION: 0
      TASKS: 0
    volumes:
      # Only THIS container touches the socket, and it is a small, audited
      # program whose entire job is refusing requests.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # --- Stateful dependencies -------------------------------------------------

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: quest
      POSTGRES_PASSWORD: quest
      POSTGRES_DB: quest
    ports: ["5432:5432"]
    volumes:
      # teach: A named volume. Container filesystems are erased on removal —
      # teach: without this line, `make down` would silently destroy the database.
      # teach: The mount point is /var/lib/postgresql, NOT .../data: Postgres 18
      # teach: changed the convention so pg_upgrade can work across versions.
      # teach: Mounting the old path makes the image refuse to start — a perfect
      # teach: illustration that a volume outlives the image it was created by.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # teach: Compose can wait for "healthy" before starting dependents, which
      # teach: is the Compose answer to startup ordering. Kubernetes deliberately
      # teach: has no equivalent: it assumes services retry, because in a real
      # teach: cluster dependencies restart at random times anyway.
      test: ["CMD-SHELL", "pg_isready -U quest -d quest"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15

  # --- The five languages ----------------------------------------------------

  compute:
    build:
      # teach: Context is this service's own folder — it needs nothing else.
      context: ../../services/compute
      args: *build-args
    image: quest/compute:dev
    environment:
      SERVICE_VERSION: "1.0.0"
      GIT_SHA: ${GIT_SHA:-dev}
    ports: ["9000:9000"]
    restart: unless-stopped
    # teach: No healthcheck. The image has no shell and no curl, so there is
    # teach: nothing to exec — a real consequence of FROM scratch. Kubernetes
    # teach: solves this properly: its httpGet probe runs from the kubelet,
    # teach: outside the container, so an empty image is no obstacle at all.

  util:
    build:
      context: ../../services/util
      args: *build-args
    image: quest/util:dev
    environment:
      SERVICE_VERSION: "1.0.0"
      GIT_SHA: ${GIT_SHA:-dev}
      PEERS: "ai:8000,compute:9000"
      # teach: Where this service posts its trace spans. It speaks the Redis
      # teach: wire protocol directly — see services/util/resp.go — so it keeps
      # teach: a zero-dependency go.mod.
      REDIS_URL: redis://redis:6379
    ports: ["8080:8080"]
    restart: unless-stopped
    depends_on: [compute, ai]

  ai:
    build:
      context: ../../services/ai
      args: *build-args
    image: quest/ai:dev
    environment:
      SERVICE_VERSION: "1.0.0"
      GIT_SHA: ${GIT_SHA:-dev}
    ports: ["8000:8000"]
    restart: unless-stopped
    healthcheck:
      # teach: The probe header again. A container's own healthcheck runs every
      # teach: few seconds forever, so without it this service's request counter
      # teach: would tick up on its own and measure nothing but the healthcheck.
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/healthz', headers={'X-Quest-Probe':'1'}))"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s

  worker:
    build:
      # teach: Context is the REPO ROOT, because the npm lockfile lives there and
      # teach: Docker cannot reach outside its context. Hence the longer COPY
      # teach: paths inside services/worker/Dockerfile.
      context: ../..
      dockerfile: services/worker/Dockerfile
      args: *build-args
    image: quest/worker:dev
    environment:
      SERVICE_VERSION: "1.0.0"
      GIT_SHA: ${GIT_SHA:-dev}
      # teach: `redis` and `postgres` are DNS names, resolved by Docker's
      # teach: embedded DNS server on the shared network. No IP addresses, no
      # teach: config files, no service registry. Kubernetes works the same way.
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://quest:quest@postgres:5432/quest
      AI_URL: http://ai:8000
      # teach: 2 keeps Queue-200 demos visible longer on the Lab counters.
      WORKER_CONCURRENCY: "2"
    ports: ["3001:3001"]
    restart: unless-stopped
    healthcheck:
      # teach: busybox wget, already in the alpine base — no extra package, no
      # teach: extra layer. Adding curl just for a healthcheck is a common way
      # teach: to grow an image for no reason.
      test: ["CMD", "wget", "-qO-", "--header=X-Quest-Probe: 1", "http://127.0.0.1:3001/healthz"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

  dashboard:
    build:
      context: ../..
      dockerfile: apps/dashboard/Dockerfile
      args: *build-args
    image: quest/dashboard:dev
    environment:
      SERVICE_VERSION: "1.0.0"
      GIT_SHA: ${GIT_SHA:-dev}
      QUEST_MODE: compose
      # teach: Tells the dashboard to reach peers by service name rather than
      # teach: localhost. Inside a container, localhost is a dead end.
      QUEST_IN_CONTAINER: "1"
      REDIS_URL: redis://redis:6379
      COMPOSE_PROJECT_NAME: container-quest
      QUEST_ALLOW_DOCKER_SOCKET: "1"
      # teach: An HTTP endpoint, not a socket path. The dashboard has no access
      # teach: to /var/run/docker.sock at all — only to the four capabilities
      # teach: the proxy above is willing to forward.
      DOCKER_HOST: tcp://socket-proxy:2375
    ports: ["3000:3000"]
    restart: unless-stopped
    healthcheck:
      # teach: 127.0.0.1, NOT localhost. Inside the container "localhost"
      # teach: resolves to the IPv6 address ::1 first, and Next binds 0.0.0.0 —
      # teach: which is IPv4-only. The result is a healthcheck that reports
      # teach: "connection refused" against a server that is working perfectly,
      # teach: reachable from everywhere except its own healthcheck. One of the
      # teach: most common and most confusing container bugs there is.
      test: ["CMD", "wget", "-qO-", "--header=X-Quest-Probe: 1", "http://127.0.0.1:3000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 8s
    depends_on: [worker, ai, util, compute]

volumes:
  pgdata:
